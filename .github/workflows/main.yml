name: main

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:

    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: 'postgres:17.6-alpine'
        ports:
          - '54322:5432'
        env:
          POSTGRES_USER: graph_test
          POSTGRES_PASSWORD: graph_test
          POSTGRES_DB: graph_test
        options: >-
          --health-cmd "pg_isready -U graph_test -d graph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: make test

  build_and_push:

    needs: test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build jar
        run: ./gradlew assemble
      - name: Build runner Docker image
        run: |
          docker build . \
            --target runner \
            --tag "rg.fr-par.scw.cloud/graph-crm-ops/graph-crm-server:${{ github.sha }}" \
            --tag "rg.fr-par.scw.cloud/graph-crm-ops/graph-crm-server:latest"
      - name: Build migrator Docker image
        run: |
          docker build . \
            --target migrator \
            --tag "rg.fr-par.scw.cloud/graph-crm-ops/graph-crm-migrator:${{ github.sha }}" \
            --tag "rg.fr-par.scw.cloud/graph-crm-ops/graph-crm-migrator:latest"

      - name: Login to Scaleway Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
          registry: rg.fr-par.scw.cloud/graph-crm-ops
      - name: Push docker server images
        if: github.ref == 'refs/heads/main'
        run: docker push -a "rg.fr-par.scw.cloud/graph-crm-ops/graph-crm-server"
      - name: Push docker migrator images
        if: github.ref == 'refs/heads/main'
        run: docker push -a "rg.fr-par.scw.cloud/graph-crm-ops/graph-crm-migrator"

  bump_infra:

    needs: build_and_push
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    concurrency:
      group: bump-infra-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          repository: palmenhq/graph-infra
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN_SECRET }}
          path: infra
      - name: Bump graph-crm-server version
        working-directory: infra
        run: |
          echo "${{ github.sha }}" > environments/prod/versions/graph-crm-server.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add environments/prod/versions/graph-crm-server.txt
          git diff --cached --quiet && exit 0
          git commit -m "graph-crm-server: ${{ github.sha }}" \
            -m "From ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          git push origin HEAD:main
