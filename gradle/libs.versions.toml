[versions]
kotlin = "2.3.10"
ktor = "3.4.0"
postgres = "42.7.9"
jooq = "3.20.10"
liquibase = "5.0.1"
kotlinLogging = "7.0.13"
slf4j = "2.0.17"
junit = "6.0.0"
mockk = "1.14.6"
ksp = "2.3.4"
ktlint = "13.1.0"
kotlinxSchema = "0.1.0"
kotlinxDatetime = "0.7.1"
picocli = "4.7.7"
hikari = "4.0.3"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-openapi = { module = "io.ktor:ktor-server-openapi", version.ref = "ktor" }
ktor-server-routing-openapi = { module = "io.ktor:ktor-server-routing-openapi", version.ref = "ktor" }
ktor-server-testHostJvm = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor" }
ktor-server-session = { module = "io.ktor:ktor-server-sessions", version.ref = "ktor" }

postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }

jooq = { module = "org.jooq:jooq", version.ref = "jooq" }

liquibase-core = { module = "org.liquibase:liquibase-core", version.ref = "liquibase" }

kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlinLogging" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

kotlinx-schema-ksp = { module = "org.jetbrains.kotlinx:kotlinx-schema-ksp", version.ref = "kotlinxSchema" }
kotlinx-schema-generator-json = { module = "org.jetbrains.kotlinx:kotlinx-schema-generator-json", version.ref = "kotlinxSchema" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
liquibase = { id = "org.liquibase.gradle", version = "3.1.0" }
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
